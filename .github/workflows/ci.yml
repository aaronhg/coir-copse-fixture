name: coir × copse gate

# Two jobs, and no Cocos editor in either — the repo ships a PRE-BUILT web-mobile target
# (commit it after `Project ▸ Build` in Creator):
#   gate         serve build/web-mobile, run the coir×copse coverage join + copse flow suite
#   deploy-demo  on main & only if the gate is green, publish that same build to GitHub Pages
# so the hosted demo is always a build that passed the join.

on: [push, pull_request]

jobs:
  gate:
    runs-on: ubuntu-latest        # ships google-chrome at /usr/bin/google-chrome,
    defaults:                     # which is exactly copse's Linux default — no browser setup needed.
      run:
        working-directory: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Guard — the built game must be committed
        run: test -f ../build/web-mobile/index.html
          || (echo "::error::build/web-mobile/ is missing — run Project ▸ Build (web-mobile) in Cocos Creator and commit it." && exit 1)

      # The two tools under test. Public repos assumed; if yours are private, add a PAT:
      #   git clone https://x-access-token:${{ secrets.TOOLS_PAT }}@github.com/<you>/coir.git
      - name: Fetch coir
        run: git clone --depth 1 https://github.com/aaronhg/coir.git /tmp/coir
      - name: Fetch + build copse
        run: |
          git clone --depth 1 https://github.com/aaronhg/copse.git /tmp/copse
          cd /tmp/copse && npm install --no-audit --no-fund && npm run build   # -> dist/copse.inject.js

      # WHY the scene never booted on the runner: copse launches Chrome with
      # --use-gl=angle --use-angle=swiftshader, i.e. ANGLE over SwiftShader's *Vulkan* device.
      # The standard runner ships the Vulkan LOADER (libvulkan1 is a google-chrome dep) but no
      # usable software Vulkan ICD/device, so ANGLE dies with "Internal Vulkan error (-3)",
      # WebGL context creation returns null, and Cocos never builds the scene graph → an empty
      # tree (covered:0, `bad-selector`). Reproduced locally: with a Vulkan device WebGL reports
      # "ANGLE (…SwiftShader Device…)"; remove it and you get the identical null-context error.
      # mesa-vulkan-drivers supplies a software (llvmpipe) Vulkan device. The probe prints the
      # resulting WebGL renderer + the Vulkan devices the loader can see, so the log shows ground
      # truth whether or not this is the whole fix.
      - name: Software Vulkan device for headless WebGL (+ ground-truth probe)
        run: |
          sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
          echo "=== registered Vulkan ICDs ==="
          ls -la /usr/share/vulkan/icd.d/ 2>/dev/null || true
          echo "=== vulkaninfo devices ==="
          vulkaninfo --summary 2>&1 | grep -iE 'deviceName|driverName|deviceType|apiVersion' | head -20 || true
          echo "=== WebGL under copse's EXACT Chrome flags ==="
          google-chrome --headless=new --no-sandbox --disable-setuid-sandbox \
            --use-gl=angle --use-angle=swiftshader --ignore-gpu-blocklist --enable-unsafe-swiftshader --mute-audio \
            --dump-dom 'data:text/html,<canvas id=c></canvas><script>var g=c.getContext("webgl2")||c.getContext("webgl");var e=g&&g.getExtension("WEBGL_debug_renderer_info");document.title="WEBGL="+(g?(e?g.getParameter(e.UNMASKED_RENDERER_WEBGL):"ctx-ok"):"NULL-CONTEXT")</script>' \
            2>/dev/null | grep -oiE '<title>[^<]*</title>' || echo "(probe produced no title)"

      # One step on purpose: the served game must outlive every command that drives it.
      # A backgrounded server in its own step is torn down when that step ends, so a gate
      # or selftest in a LATER step hits a dead port (the "RED-ALWAYS" failure mode). Here
      # the server is a child of THIS shell and the trap kills it only after all of it runs.
      #
      # Headless is fine once a software Vulkan device exists (see the step above); copse finds
      # /usr/bin/google-chrome itself. A CI container has no display and is thrown away, so
      # SwiftShader's heat cost is moot.
      - name: Serve + coir clickmap + flow suite + gate + selftest
        env: { COPSE_CLI: /tmp/copse/src/cli.js, URL: 'http://127.0.0.1:8899/' }
        run: |
          set -u
          mkdir -p results
          node serve.mjs 8899 & SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          npx --yes wait-on "$URL" -t 30000

          # Boot diagnostic through copse's OWN Chrome (not a standalone probe): dumps the WebGL
          # renderer, the live scene's child count, and the GAME's console/pageerrors. If the scene
          # never populates it exits non-zero so we fail FAST here with the diagnosis, instead of
          # letting copse's boot-wait spin ~8× across the suite/gate/selftest (~15 min of nothing).
          echo "::group::Boot diagnostic — copse Chrome: WebGL + scene + game console"
          COPSE_DRIVER=/tmp/copse/src/drivers/puppeteer.js node boot-diag.mjs "$URL" && diag=0 || diag=$?
          echo "::endgroup::"
          if [ "$diag" != 0 ]; then echo "::error::scene did not boot in copse's Chrome (exit $diag) — see boot diagnostic above"; exit 1; fi

          rc=0

          echo "::group::coir — the static ClickEvent map (coir clickmap)"
          node /tmp/coir/src/cli.js -C .. clickmap scene/fixture.scene -o json > coir-rows.json || rc=1
          echo "::endgroup::"

          echo "::group::Flow suite — copse's own runner (copse run <dir> --junit)"
          node "$COPSE_CLI" run "$URL" tests --junit results/junit.xml || rc=1
          echo "::endgroup::"

          echo "::group::Coverage gate — the coir × copse join (green / red-on-regression)"
          node gate.mjs --url="$URL" || rc=1
          echo "::endgroup::"

          echo "::group::Selftest — prove the gate can actually go red"
          node selftest.mjs --url="$URL" || rc=1
          echo "::endgroup::"

          exit $rc

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: ci/results/junit.xml
          check_name: coir × copse tests
          annotate_only: true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: join-evidence
          path: |
            ci/results/junit.xml
            ci/coir-rows.json
            ci/expected.json

  # Publish the SAME committed web-mobile to GitHub Pages — but ONLY after the gate is
  # green, so the hosted demo is always a build that passed the coverage join. There's no
  # editor build here either; it just uploads the static folder that's already in the repo.
  # One-time setup: repo Settings ▸ Pages ▸ Source = "GitHub Actions".
  deploy-demo:
    needs: gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web-mobile   # Cocos 3.8 web-mobile uses relative paths → runs fine from the /<repo>/ Pages subpath
      - id: deployment
        uses: actions/deploy-pages@v4
